name: Run8 Candidate Probe

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  materialize-candidate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Detect source materialization state
        id: state
        shell: bash
        run: |
          if [ -f .ci/source-materialized.marker ]; then
            echo "materialized=true" >> "$GITHUB_OUTPUT"
          else
            echo "materialized=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Rebuild and verify candidate patch
        if: steps.state.outputs.materialized != 'true'
        shell: python
        run: |
          import base64
          import gzip
          import hashlib
          from pathlib import Path

          parts = sorted(Path('.ci/run8_patch').glob('part*.b64'))
          if len(parts) != 4:
              raise SystemExit(f'expected 4 patch chunks, got {len(parts)}')
          encoded = ''.join(p.read_text(encoding='ascii') for p in parts)
          compressed = base64.b64decode(encoded, validate=True)
          patch = gzip.decompress(compressed)
          digest = hashlib.sha256(patch).hexdigest()
          print('PATCH_SHA256=' + digest)
          if digest != '32c8402fd1070335d6eca4a8f38edbe7517f340ce8d73a6e7a02c7088119a5dc':
              raise SystemExit('candidate patch SHA-256 mismatch')
          Path('.ci/run8_candidate.patch').write_bytes(patch)
      - name: Apply candidate patch
        if: steps.state.outputs.materialized != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .ci/run8_candidate.patch
          git apply .ci/run8_candidate.patch
      - name: Restore two exact final candidate files
        if: steps.state.outputs.materialized != 'true'
        shell: python
        run: |
          import base64
          import gzip
          import hashlib
          from pathlib import Path

          exact_files = [
              (
                  Path('.ci/exact/test_run8_completion.py.gz.b64'),
                  Path('tests/test_run8_completion.py'),
                  'f3b871b2cb5e92c8d99acfbe29152c986bb4a665e9b915f5694e991d12647518',
              ),
              (
                  Path('.ci/exact/windows_gui_acceptance.py.gz.b64'),
                  Path('tools/windows_gui_acceptance.py'),
                  '19a16eb16d7d88a68f9081ccd3f1b09c39dd1f57808890a0de2c1b3e694662ad',
              ),
          ]
          for source, target, expected in exact_files:
              encoded = source.read_text(encoding='ascii')
              raw = gzip.decompress(base64.b64decode(encoded, validate=True))
              actual = hashlib.sha256(raw).hexdigest()
              print(f'{target}: {actual}')
              if actual != expected:
                  raise SystemExit(f'exact source SHA-256 mismatch for {target}')
              target.write_bytes(raw)
      - name: Verify staged 96 candidate Git blobs
        if: steps.state.outputs.materialized != 'true'
        shell: python
        run: |
          import hashlib
          import subprocess
          from pathlib import Path

          subprocess.check_call(['git', 'add', '-A'])
          expected = {}
          for raw in Path('.ci/candidate_manifest.sha256').read_text(encoding='utf-8').splitlines():
              if not raw.strip():
                  continue
              digest, path = raw.split('  ', 1)
              expected[path] = digest

          index_paths = set(subprocess.check_output(['git', 'ls-files'], text=True).splitlines())
          missing, different, matched = [], [], []
          for path, digest in sorted(expected.items()):
              if path not in index_paths:
                  missing.append(path)
                  continue
              data = subprocess.check_output(['git', 'show', f':{path}'])
              actual = hashlib.sha256(data).hexdigest()
              if actual == digest:
                  matched.append(path)
              else:
                  different.append((path, digest, actual))
          tracked_product = {
              path for path in index_paths
              if not path.startswith('.ci/')
              and path != '.github/workflows/run8-candidate-probe.yml'
          }
          extra = sorted(tracked_product - set(expected))
          print(f'MATCHED={len(matched)} MISSING={len(missing)} DIFFERENT={len(different)} EXTRA={len(extra)}')
          for path in missing:
              print('MISSING', path)
          for path, exp, actual in different:
              print('DIFF', path, 'expected='+exp, 'actual='+actual)
          for path in extra:
              print('EXTRA', path)
          if missing or different or extra or len(matched) != 96:
              raise SystemExit(2)
      - name: Commit materialized source except release workflow
        if: steps.state.outputs.materialized != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git reset .ci/run8_candidate.patch .github/workflows/windows-release.yml
          rm -f .ci/run8_candidate.patch
          printf '%s\n' 'Candidate source materialized; release workflow is written separately by authorized connector.' > .ci/source-materialized.marker
          git add .ci/source-materialized.marker
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "CI: materialize Run8 GitHubReady source"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Verify materialized HEAD against all 96 candidate blobs
        if: steps.state.outputs.materialized == 'true'
        shell: python
        run: |
          import hashlib
          import subprocess
          from pathlib import Path

          expected = {}
          for raw in Path('.ci/candidate_manifest.sha256').read_text(encoding='utf-8').splitlines():
              if raw.strip():
                  digest, path = raw.split('  ', 1)
                  expected[path] = digest
          tree_paths = set(subprocess.check_output(['git', 'ls-tree', '-r', '--name-only', 'HEAD'], text=True).splitlines())
          missing, different, matched = [], [], []
          for path, digest in sorted(expected.items()):
              if path not in tree_paths:
                  missing.append(path)
                  continue
              data = subprocess.check_output(['git', 'show', f'HEAD:{path}'])
              actual = hashlib.sha256(data).hexdigest()
              if actual == digest:
                  matched.append(path)
              else:
                  different.append((path, digest, actual))
          product_paths = {
              path for path in tree_paths
              if not path.startswith('.ci/')
              and path != '.github/workflows/run8-candidate-probe.yml'
          }
          extra = sorted(product_paths - set(expected))
          print(f'HEAD_MATCHED={len(matched)} MISSING={len(missing)} DIFFERENT={len(different)} EXTRA={len(extra)}')
          for path in missing:
              print('MISSING', path)
          for path, exp, actual in different:
              print('DIFF', path, 'expected='+exp, 'actual='+actual)
          for path in extra:
              print('EXTRA', path)
          if missing or different or extra or len(matched) != 96:
              raise SystemExit(2)
