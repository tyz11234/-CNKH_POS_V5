name: Run8 Candidate Probe

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  compare-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare Git blob bytes with GitHubReady candidate manifest
        shell: python
        run: |
          import hashlib
          import subprocess
          from pathlib import Path

          manifest = Path('.ci/candidate_manifest.sha256')
          expected = {}
          for raw in manifest.read_text(encoding='utf-8').splitlines():
              if not raw.strip():
                  continue
              digest, path = raw.split('  ', 1)
              expected[path] = digest

          tree_paths = set(
              subprocess.check_output(
                  ['git', 'ls-tree', '-r', '--name-only', 'HEAD'], text=True
              ).splitlines()
          )
          missing = []
          different = []
          matched = []
          for path, digest in sorted(expected.items()):
              if path not in tree_paths:
                  missing.append(path)
                  continue
              data = subprocess.check_output(['git', 'show', f'HEAD:{path}'])
              actual = hashlib.sha256(data).hexdigest()
              if actual == digest:
                  matched.append(path)
              else:
                  different.append((path, digest, actual))

          tracked = {
              path for path in tree_paths
              if not path.startswith('.ci/')
              and path != '.github/workflows/run8-candidate-probe.yml'
          }
          extra = sorted(tracked - set(expected))

          print(f'MATCHED={len(matched)} MISSING={len(missing)} DIFFERENT={len(different)} EXTRA={len(extra)}')
          for path in missing:
              print('MISSING', path)
          for path, expected_hash, actual_hash in different:
              print('DIFF', path, 'expected='+expected_hash, 'actual='+actual_hash)
          for path in extra:
              print('EXTRA', path)

          if missing or different or extra:
              raise SystemExit(2)
