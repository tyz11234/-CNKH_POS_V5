name: Apply 50x30 Product Label Spec

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/apply-50x30-label.yml"

permissions:
  contents: write

jobs:
  apply-test:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      QT_LOGGING_RULES: qt.qpa.fonts.warning=false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply 50x30 label specification
        shell: python
        run: |
          from pathlib import Path

          def replace(path: str, old: str, new: str, *, count: int | None = None) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              occurrences = text.count(old)
              if occurrences == 0:
                  raise SystemExit(f"expected text not found in {path}: {old!r}")
              if count is not None and occurrences != count:
                  raise SystemExit(f"unexpected occurrence count in {path}: {occurrences} != {count}")
              file.write_text(text.replace(old, new), encoding="utf-8")

          ui = Path("cnkh_pos/ui/admin/barcode_labels.py")
          text = ui.read_text(encoding="utf-8")
          text = text.replace(
              "选择商品、标签尺寸和打印张数。默认 40×30 mm；打印时可在 Windows 对话框选择实际标签打印机。",
              "选择商品、标签尺寸和打印张数。默认 50×30 mm；打印时可在 Windows 对话框选择实际标签打印机。",
          )
          anchor = "        for label_profile in LABEL_PROFILES:\n            self.profile.addItem(label_profile.label, label_profile.key)\n"
          if anchor not in text:
              raise SystemExit("barcode profile UI anchor not found")
          replacement = anchor + (
              "        default_profile_index = self.profile.findData(\"50x30\")\n"
              "        if default_profile_index >= 0:\n"
              "            self.profile.setCurrentIndex(default_profile_index)\n"
          )
          text = text.replace(anchor, replacement, 1)
          ui.write_text(text, encoding="utf-8")

          replace(
              "tests/test_barcode_labels.py",
              "def test_standard_40x30_profile_is_default_market_profile() -> None:\n    assert LABEL_PROFILES[0].key == \"40x30\"\n    assert LABEL_PROFILES[0].width_mm == 40.0\n    assert LABEL_PROFILES[0].height_mm == 30.0\n",
              "def test_50x30_profile_is_required_product_label_size() -> None:\n    profile = get_label_profile(\"50x30\")\n    assert profile.width_mm == 50.0\n    assert profile.height_mm == 30.0\n",
              count=1,
          )
          replace("tests/test_barcode_labels.py", 'get_label_profile("40x30")', 'get_label_profile("50x30")', count=1)
          replace("tests/test_barcode_labels_ui.py", 'page.profile.currentData() == "40x30"', 'page.profile.currentData() == "50x30"', count=1)
          replace("tests/test_barcode_labels_integration.py", 'page.profile.currentData() == "40x30"', 'page.profile.currentData() == "50x30"', count=1)
          replace("tests/test_barcode_labels_integration.py", 'get_label_profile("40x30")', 'get_label_profile("50x30")', count=1)
          replace("tests/test_full_business_lifecycle.py", 'get_label_profile("40x30")', 'get_label_profile("50x30")', count=1)
          replace("tests/test_full_business_lifecycle.py", 'passed("barcode_labels.40x30_four_copies")', 'passed("barcode_labels.50x30_four_copies")', count=1)
          replace("tests/test_final_print_evidence.py", 'get_label_profile("40x30")', 'get_label_profile("50x30")', count=1)
          replace("tests/test_final_print_evidence.py", 'final-product-label-40x30-4copies.pdf', 'final-product-label-50x30-4copies.pdf', count=1)
          replace("tests/test_final_print_evidence.py", '"profile": "40x30"', '"profile": "50x30"', count=1)

          # 40x30 may remain only as an optional supported profile in the service.
          import subprocess
          result = subprocess.run(
              ["git", "grep", "-n", "40x30", "--", ":!cnkh_pos/services/barcode_labels.py"],
              text=True,
              capture_output=True,
          )
          if result.returncode == 0 and result.stdout.strip():
              raise SystemExit("unexpected production/test 40x30 reference remains:\n" + result.stdout)
          if "80mm" not in Path("tests/test_final_print_evidence.py").read_text(encoding="utf-8"):
              raise SystemExit("80mm receipt evidence contract was lost")
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Compile Qt resources
        run: pyside6-rcc resources/resources.qrc -o cnkh_pos/resources_rc.py
      - name: Ruff changed label files
        run: >-
          python -m ruff check
          cnkh_pos/ui/admin/barcode_labels.py
          tests/test_barcode_labels.py
          tests/test_barcode_labels_ui.py
          tests/test_barcode_labels_integration.py
          tests/test_full_business_lifecycle.py
          tests/test_final_print_evidence.py
      - name: Focused 50x30 label tests
        run: >-
          python -m pytest -q
          tests/test_barcode_labels.py
          tests/test_barcode_labels_ui.py
          tests/test_barcode_labels_integration.py
          tests/test_final_print_evidence.py
      - name: Commit verified 50x30 specification and self-clean workflow
        shell: bash
        run: |
          rm .github/workflows/apply-50x30-label.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cnkh_pos/ui/admin/barcode_labels.py tests/test_barcode_labels.py tests/test_barcode_labels_ui.py tests/test_barcode_labels_integration.py tests/test_full_business_lifecycle.py tests/test_final_print_evidence.py .github/workflows/apply-50x30-label.yml
          git diff --cached --check
          git commit -m "Set product barcode labels to 50x30 mm by default"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
