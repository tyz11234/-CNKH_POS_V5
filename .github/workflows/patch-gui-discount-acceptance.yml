name: Patch GUI Discount Acceptance

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/patch-gui-discount-acceptance.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - name: Patch acceptance to use the real DiscountDialog
        shell: python
        run: |
          from pathlib import Path

          path = Path("tools/windows_gui_acceptance.py")
          text = path.read_text(encoding="utf-8")
          import_old = "    from cnkh_pos.ui.dialogs.checkout import CheckoutDialog, SaleCompletedDialog\n"
          import_new = import_old + "    from cnkh_pos.ui.dialogs.discount import DiscountDialog\n"
          if "from cnkh_pos.ui.dialogs.discount import DiscountDialog" not in text:
              if import_old not in text:
                  raise SystemExit("checkout import anchor not found")
              text = text.replace(import_old, import_new, 1)

          old = '''        staff_window.cart.selectRow(0)\n        schedule_modal(\n            app,\n            QTimer,\n            lambda dialog: isinstance(dialog, QInputDialog),\n            lambda dialog: enter_double(dialog, 0.50),\n        )\n        QTest.mouseClick(staff_window.discount_button, Qt.MouseButton.LeftButton)\n        assert 50 in staff_window.cart_discounts.values()\n'''
          new = '''        staff_window.cart.selectRow(0)\n        total_before_discount = staff_window._cart_total()\n\n        def apply_item_discount(dialog: QDialog) -> None:\n            assert isinstance(dialog, DiscountDialog)\n            dialog.mode.setCurrentIndex(dialog.mode.findData("FIXED"))\n            dialog.value.setValue(0.50)\n            dialog.accept()\n\n        schedule_modal(\n            app,\n            QTimer,\n            lambda dialog: isinstance(dialog, DiscountDialog),\n            apply_item_discount,\n        )\n        QTest.mouseClick(staff_window.discount_button, Qt.MouseButton.LeftButton)\n        assert 50 in staff_window.cart_discounts.values()\n        assert staff_window._cart_total() == total_before_discount - 50\n'''
          if old not in text:
              raise SystemExit("legacy discount acceptance block not found")
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
      - name: Commit acceptance adaptation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/windows_gui_acceptance.py
          git diff --cached --check
          git commit -m "Adapt GUI acceptance to percentage and RM discount dialog"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
