name: Main Run Monitor

on:
  push:
    branches: ["ci/run8-githubready-20260810"]
    paths:
      - ".github/workflows/main-run-monitor.yml"

permissions:
  actions: read
  contents: write

jobs:
  locate-main-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/run8-githubready-20260810
      - name: Locate final main Windows run
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: b47c95833a20335ab13139482662748d1fa07898
        run: |
          import json
          import os
          import time
          import urllib.request
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          target = os.environ["TARGET_SHA"]
          url = f"https://api.github.com/repos/{repo}/actions/runs?head_sha={target}&event=push&per_page=50"
          selected = None
          for _ in range(18):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req) as response:
                  payload = json.load(response)
              matches = [
                  run for run in payload.get("workflow_runs", [])
                  if run.get("name") == "Windows Release Gate"
                  and run.get("head_sha") == target
                  and run.get("event") == "push"
              ]
              if matches:
                  selected = max(matches, key=lambda run: int(run["id"]))
                  break
              time.sleep(10)
          if selected is None:
              raise SystemExit("final main Windows Release Gate push run was not found")
          result = {
              "id": selected["id"],
              "run_number": selected["run_number"],
              "name": selected["name"],
              "event": selected["event"],
              "head_branch": selected["head_branch"],
              "head_sha": selected["head_sha"],
              "status": selected["status"],
              "conclusion": selected["conclusion"],
              "html_url": selected["html_url"],
          }
          Path("main-run-monitor.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(result, indent=2))
      - name: Persist run id on temporary CI branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main-run-monitor.json
          git commit -m "Record final main Windows run id"
          git push origin HEAD:ci/run8-githubready-20260810
