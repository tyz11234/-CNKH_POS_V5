name: Discount Targeted Check

on:
  pull_request:
    branches:
      - ci/run8-githubready-20260810
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discount-targeted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-discount:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      QT_LOGGING_RULES: qt.qpa.fonts.warning=false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Compile Qt resources
        run: pyside6-rcc resources/resources.qrc -o cnkh_pos/resources_rc.py
      - name: Ruff discount changes
        run: >-
          python -m ruff check
          cnkh_pos/services/discounts.py
          cnkh_pos/ui/dialogs/discount.py
          cnkh_pos/ui/staff/enhanced_window.py
          tests/test_discount_controls.py
      - name: Discount focused tests
        run: python -m pytest -q tests/test_discount_controls.py
      - name: Compile discount changes
        run: >-
          python -m compileall -q
          cnkh_pos/services/discounts.py
          cnkh_pos/ui/dialogs/discount.py
          cnkh_pos/ui/staff/enhanced_window.py
          tests/test_discount_controls.py
      - name: Build Staff EXE
        run: pyinstaller --noconfirm --clean build/staff.spec
      - name: Packaged Staff self-test
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist/CNKH_POS_Staff.exe"
          New-Item -ItemType Directory -Path focused-artifacts -Force | Out-Null
          $report = Join-Path (Resolve-Path focused-artifacts) "staff-self-test.json"
          $env:CNKH_POS_SELF_TEST_REPORT = $report
          $process = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Staff self-test failed with exit code $($process.ExitCode)" }
          if (-not (Test-Path $report)) { throw "Staff self-test report missing" }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if ($result.status -ne "PASS" -or $result.mode -ne "staff") { throw "Staff self-test did not report PASS/staff" }
      - name: Upload focused diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Discount-Targeted-Diagnostics
          path: focused-artifacts/
          if-no-files-found: ignore
          retention-days: 14
