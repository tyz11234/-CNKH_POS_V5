name: Barcode Labels Focused Gate

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - "cnkh_pos/services/barcode_labels.py"
      - "cnkh_pos/ui/admin/barcode_labels.py"
      - "cnkh_pos/ui/admin/window.py"
      - "tests/test_barcode_labels.py"
      - "tests/test_barcode_labels_integration.py"
      - ".github/workflows/barcode-labels-gate.yml"

permissions:
  contents: read

concurrency:
  group: barcode-labels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-barcode-labels:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: "offscreen"
      QT_LOGGING_RULES: "qt.qpa.fonts.warning=false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Compile Qt resources
        run: pyside6-rcc resources/resources.qrc -o cnkh_pos/resources_rc.py
      - name: Ruff focused files
        run: >-
          python -m ruff check
          cnkh_pos/services/barcode_labels.py
          cnkh_pos/ui/admin/barcode_labels.py
          cnkh_pos/ui/admin/window.py
          tests/test_barcode_labels.py
          tests/test_barcode_labels_integration.py
      - name: Barcode label unit and integration tests
        run: >-
          python -m pytest -q
          tests/test_barcode_labels.py
          tests/test_barcode_labels_integration.py
      - name: Compile new barcode label code
        run: >-
          python -m compileall -q
          cnkh_pos/services/barcode_labels.py
          cnkh_pos/ui/admin/barcode_labels.py
          tests/test_barcode_labels.py
          tests/test_barcode_labels_integration.py
      - name: Build Admin EXE with barcode label dependencies
        run: pyinstaller --noconfirm --clean build/admin.spec
      - name: Packaged Admin import/self-test smoke
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist/CNKH_POS_Admin.exe"
          if ((Get-Item $exe).Length -lt 10MB) { throw "Admin EXE is unexpectedly small" }
          New-Item -ItemType Directory -Path focused-artifacts -Force | Out-Null
          $report = (Join-Path (Resolve-Path focused-artifacts) "barcode-admin-self-test.json")
          $env:CNKH_POS_SELF_TEST_REPORT = $report
          $process = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Admin self-test failed with exit code $($process.ExitCode)" }
          if (-not (Test-Path $report)) { throw "Admin self-test report missing" }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if ($result.status -ne "PASS" -or $result.mode -ne "admin") {
            throw "Admin self-test did not report PASS/admin"
          }
      - name: Upload focused diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Barcode-Labels-Focused-Diagnostics
          path: focused-artifacts/
          if-no-files-found: ignore
          retention-days: 14
