name: Final Run111 Installed Proof

on:
  pull_request:
    branches:
      - ci/final-installed-proof-base-20260811

permissions:
  contents: read
  actions: read

jobs:
  final-installed-proof:
    runs-on: windows-latest
    timeout-minutes: 70
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      FINAL_MAIN_SHA: 5d8d7439de7f1d00178e80937e21bef9f8e6ad9d
      FINAL_RUN_ID: "31416725115"
      FINAL_RUN_NUMBER: "111"
      FINAL_ARTIFACT_ID: "9074265609"
      FINAL_ARTIFACT_DIGEST: "sha256:d3491a22781b23b4c5c0de6cfcc1547473f0bb61b7f54dc20043f67ab6f29cc7"
    steps:
      - name: Checkout exact final main source
        uses: actions/checkout@v4
        with:
          ref: 5d8d7439de7f1d00178e80937e21bef9f8e6ad9d
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Download exact Run 111 Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: CNKH-Hardware-POS-V5-Windows
          path: downloaded-package
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 31416725115

      - name: Verify Run 111 identity and SHA256SUMS
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path final-proof-evidence -Force | Out-Null
          $package = (Resolve-Path "downloaded-package").Path
          $buildInfoPath = Join-Path $package "build-info.json"
          $sumsPath = Join-Path $package "SHA256SUMS.txt"
          $setupPath = Join-Path $package "CNKH_Hardware_POS_V5_Setup.exe"
          if (-not (Test-Path $buildInfoPath)) { throw "build-info.json missing" }
          if (-not (Test-Path $sumsPath)) { throw "SHA256SUMS.txt missing" }
          if (-not (Test-Path $setupPath)) { throw "Setup.exe missing" }
          $buildInfo = Get-Content $buildInfoPath -Raw | ConvertFrom-Json
          if ([string]$buildInfo.workflow_run -ne "111") { throw "Expected Run 111, got $($buildInfo.workflow_run)" }
          if ($buildInfo.version -ne "5.0.0-alpha.4") { throw "Version mismatch: $($buildInfo.version)" }
          foreach ($line in Get-Content $sumsPath) {
            if (-not $line.Trim()) { continue }
            $parts = $line -split '\s+', 2
            if ($parts.Count -ne 2) { throw "Invalid SHA256SUMS line: $line" }
            $candidate = Join-Path $package $parts[1].Trim()
            if (-not (Test-Path $candidate)) { throw "SHA256SUMS references missing file: $($parts[1])" }
            $actual = (Get-FileHash $candidate -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $parts[0].Trim().ToLowerInvariant()) { throw "SHA256 mismatch for $($parts[1])" }
          }
          [pscustomobject]@{
            status = "PASS"
            final_main_sha = $env:FINAL_MAIN_SHA
            source_release_gate_run = 111
            source_release_run_id = [long]$env:FINAL_RUN_ID
            source_release_artifact_id = [long]$env:FINAL_ARTIFACT_ID
            source_release_artifact_digest = $env:FINAL_ARTIFACT_DIGEST
            build_info_commit = $buildInfo.commit
            version = $buildInfo.version
            setup_sha256 = (Get-FileHash $setupPath -Algorithm SHA256).Hash.ToLowerInvariant()
            package_sha256_verified = $true
          } | ConvertTo-Json -Depth 8 | Set-Content final-proof-evidence/artifact-identity.json -Encoding UTF8

      - name: Silent install exact Run 111 Setup
        shell: pwsh
        run: |
          $package = (Resolve-Path "downloaded-package").Path
          $setup = Join-Path $package "CNKH_Hardware_POS_V5_Setup.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "CNKH-POS-V5-Final-Installed"
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }
          $process = Start-Process -FilePath $setup -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/SP-",
            "/DIR=$installDir"
          ) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $admin = Join-Path $installDir "CNKH_POS_Admin.exe"
          $staff = Join-Path $installDir "CNKH_POS_Staff.exe"
          if (-not (Test-Path $admin) -or -not (Test-Path $staff)) { throw "Installed Admin/Staff EXE missing" }
          [pscustomobject]@{
            status = "PASS"
            install_dir = $installDir
            admin_sha256 = (Get-FileHash $admin -Algorithm SHA256).Hash.ToLowerInvariant()
            staff_sha256 = (Get-FileHash $staff -Algorithm SHA256).Hash.ToLowerInvariant()
          } | ConvertTo-Json -Depth 5 | Set-Content final-proof-evidence/installed-files.json -Encoding UTF8

      - name: Installed Admin and Staff self-tests
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "CNKH-POS-V5-Final-Installed"
          $admin = Join-Path $installDir "CNKH_POS_Admin.exe"
          $staff = Join-Path $installDir "CNKH_POS_Staff.exe"
          $profile = Join-Path $env:RUNNER_TEMP "CNKH-POS-V5-Final-SelfTest-Profile"
          if (Test-Path $profile) { Remove-Item $profile -Recurse -Force }
          New-Item -ItemType Directory -Path $profile -Force | Out-Null
          $env:LOCALAPPDATA = $profile

          $adminReport = (Resolve-Path "final-proof-evidence").Path + "\\installed-admin.json"
          $env:CNKH_POS_SELF_TEST_REPORT = $adminReport
          $p = Start-Process -FilePath $admin -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path $adminReport)) { throw "Installed Admin self-test failed: $($p.ExitCode)" }
          $r = Get-Content $adminReport -Raw | ConvertFrom-Json
          if ($r.status -ne "PASS" -or $r.mode -ne "admin") { throw "Installed Admin JSON not PASS/admin" }

          $staffReport = (Resolve-Path "final-proof-evidence").Path + "\\installed-staff.json"
          $env:CNKH_POS_SELF_TEST_REPORT = $staffReport
          $p = Start-Process -FilePath $staff -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path $staffReport)) { throw "Installed Staff self-test failed: $($p.ExitCode)" }
          $r = Get-Content $staffReport -Raw | ConvertFrom-Json
          if ($r.status -ne "PASS" -or $r.mode -ne "staff") { throw "Installed Staff JSON not PASS/staff" }

      - name: Full 25-check business lifecycle after installation
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if (Test-Path self-test-artifacts) { Remove-Item self-test-artifacts -Recurse -Force }
          python -m pytest -q tests/test_full_business_lifecycle.py
          $report = "self-test-artifacts/full-business-acceptance.json"
          if (-not (Test-Path $report)) { throw "Full business lifecycle report missing" }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if ($result.status -ne "PASS") { throw "Business lifecycle did not report PASS" }
          $required = @(
            "users.create_and_authenticate",
            "categories.add_and_rename",
            "customers_and_suppliers.add_update",
            "products.auto_and_manual_barcode",
            "products.edit",
            "supplier_product_mapping",
            "purchase.create_receive_and_pay",
            "purchase.delete_and_reverse_stock",
            "pos.hold_and_retrieve",
            "pos.checkout_percent_fixed_discount_and_rounding",
            "receipt.text_and_80mm_pdf",
            "sales.return_then_delete_with_stock_reversal",
            "customer.credit_sale_and_payment",
            "stocktake.complete_with_variance",
            "reports.sales_profit_receivable",
            "daily_cash_closing",
            "barcode_labels.50x30_four_copies",
            "excel.template_preview_import",
            "product_dialog.explicit_auto_manual_barcode_mode",
            "delete.customer_supplier_product_preserves_history",
            "backup_and_restore",
            "database.integrity_check",
            "admin_gui.all_pages_and_new_controls",
            "staff_gui.opens_with_discount_and_checkout",
            "audit_trail"
          )
          $passed = @($result.checks | Where-Object { $_.status -eq "PASS" } | ForEach-Object { $_.name })
          $missing = @($required | Where-Object { $_ -notin $passed })
          if ($missing.Count -ne 0) { throw "Missing required PASS checks: $($missing -join ', ')" }
          if ($passed.Count -lt 25) { throw "Expected at least 25 PASS checks; got $($passed.Count)" }
          Copy-Item $report final-proof-evidence/full-business-acceptance.json -Force

      - name: Dynamic 80mm receipt and barcode-label proof
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q tests/test_final_print_evidence.py
          $report = "self-test-artifacts/final-print-evidence.json"
          if (-not (Test-Path $report)) { throw "Final print evidence JSON missing" }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if ($result.status -ne "PASS") { throw "Final print evidence did not report PASS" }
          if ([double]$result.receipt.qt_page_width_mm -lt 79.0 -or [double]$result.receipt.qt_page_width_mm -gt 81.0) { throw "Receipt width is not 80mm" }
          if ([double]$result.receipt.qt_page_height_mm -lt 110.0 -or [double]$result.receipt.qt_page_height_mm -gt 130.0) { throw "Receipt dynamic height is out of expected range" }
          Copy-Item self-test-artifacts/final-print-evidence.json final-proof-evidence/ -Force
          Copy-Item self-test-artifacts/final-receipt-qt-80mm-preview.png final-proof-evidence/ -Force
          Copy-Item self-test-artifacts/final-receipt-qt-80mm.pdf final-proof-evidence/ -Force
          Copy-Item self-test-artifacts/final-product-label-50x30-4copies.pdf final-proof-evidence/ -Force

      - name: Create clean normal-launch profile
        shell: pwsh
        run: |
          $profile = Join-Path $env:RUNNER_TEMP "CNKH-POS-V5-Final-NormalLaunch-Profile"
          if (Test-Path $profile) { Remove-Item $profile -Recurse -Force }
          New-Item -ItemType Directory -Path $profile -Force | Out-Null
          $env:LOCALAPPDATA = $profile
          @'
          from cnkh_pos.config import AppPaths
          from cnkh_pos.database.bootstrap import bootstrap_database
          from cnkh_pos.database.connection import Database
          from cnkh_pos.services.auth import AuthService

          paths = AppPaths.default()
          paths.ensure_directories()
          bootstrap_database(paths.database, paths.backups)
          database = Database(paths.database)
          with database.transaction() as conn:
              admin_id = AuthService.create_user(
                  conn,
                  username="final-admin",
                  display_name="Final Admin",
                  password="FinalAdmin123!",
                  role="ADMIN",
                  permissions={},
                  admin_id=None,
              )
              AuthService.create_user(
                  conn,
                  username="final-staff",
                  display_name="Final Staff",
                  password="FinalStaff123!",
                  role="STAFF",
                  permissions={"apply_discount": True},
                  admin_id=admin_id,
              )
          '@ | python -
          "CNKH_FINAL_NORMAL_PROFILE=$profile" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Installed EXEs open real Windows login windows
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = $env:CNKH_FINAL_NORMAL_PROFILE
          Remove-Item Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue
          $installDir = Join-Path $env:RUNNER_TEMP "CNKH-POS-V5-Final-Installed"
          $admin = Join-Path $installDir "CNKH_POS_Admin.exe"
          $staff = Join-Path $installDir "CNKH_POS_Staff.exe"

          function Test-CnkhWindow {
            param([string]$ExePath,[string]$ProcessName,[string]$ExpectedTitle)
            $startedAt = Get-Date
            $launcher = $null
            $observed = $null
            try {
              $launcher = Start-Process -FilePath $ExePath -PassThru
              for ($attempt = 0; $attempt -lt 360; $attempt++) {
                Start-Sleep -Milliseconds 250
                $candidates = @(Get-Process -Name $ProcessName -ErrorAction SilentlyContinue | Where-Object { $_.StartTime -ge $startedAt.AddSeconds(-2) })
                foreach ($candidate in $candidates) {
                  $candidate.Refresh()
                  if ($candidate.MainWindowHandle -ne 0 -and $candidate.MainWindowTitle -eq $ExpectedTitle) { $observed = $candidate; break }
                }
                if ($null -ne $observed) { break }
                if ($launcher.HasExited) { break }
              }
              if ($null -eq $observed) {
                $exitCode = if ($null -ne $launcher -and $launcher.HasExited) { $launcher.ExitCode } else { $null }
                return [pscustomobject]@{exe=$ExePath;expected_title=$ExpectedTitle;observed_title="";main_window_handle=0;exit_code=$exitCode;status="FAIL"}
              }
              return [pscustomobject]@{exe=$ExePath;expected_title=$ExpectedTitle;observed_title=$observed.MainWindowTitle;main_window_handle=$observed.MainWindowHandle;exit_code=$null;status="PASS"}
            } finally {
              Get-Process -Name $ProcessName -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            }
          }
          $launch = @(
            Test-CnkhWindow -ExePath $admin -ProcessName "CNKH_POS_Admin" -ExpectedTitle "CNKH POS Admin Login"
            Test-CnkhWindow -ExePath $staff -ProcessName "CNKH_POS_Staff" -ExpectedTitle "CNKH POS Staff Login"
          )
          $launch | ConvertTo-Json -Depth 8 | Set-Content final-proof-evidence/installed-normal-launch.json -Encoding UTF8
          $launch | ConvertTo-Json -Depth 8 | Write-Host
          if (@($launch | Where-Object { $_.status -ne "PASS" }).Count -ne 0) { throw "Installed EXE normal launch failed" }

      - name: Write final proof summary
        shell: pwsh
        run: |
          $business = Get-Content final-proof-evidence/full-business-acceptance.json -Raw | ConvertFrom-Json
          $print = Get-Content final-proof-evidence/final-print-evidence.json -Raw | ConvertFrom-Json
          $admin = Get-Content final-proof-evidence/installed-admin.json -Raw | ConvertFrom-Json
          $staff = Get-Content final-proof-evidence/installed-staff.json -Raw | ConvertFrom-Json
          $launch = @(Get-Content final-proof-evidence/installed-normal-launch.json -Raw | ConvertFrom-Json)
          $identity = Get-Content final-proof-evidence/artifact-identity.json -Raw | ConvertFrom-Json
          if ($business.status -ne "PASS" -or $print.status -ne "PASS" -or $admin.status -ne "PASS" -or $staff.status -ne "PASS") { throw "Final proof contains non-PASS result" }
          if (@($launch | Where-Object { $_.status -ne "PASS" }).Count -ne 0) { throw "Launch proof contains non-PASS result" }
          [pscustomobject]@{
            status = "PASS"
            final_main_sha = $env:FINAL_MAIN_SHA
            source_release_gate_run = 111
            source_release_artifact_id = [long]$env:FINAL_ARTIFACT_ID
            source_release_artifact_digest = $env:FINAL_ARTIFACT_DIGEST
            setup_sha256 = $identity.setup_sha256
            full_business_checks_pass = @($business.checks | Where-Object { $_.status -eq "PASS" }).Count
            installed_admin_self_test = $admin.status
            installed_staff_self_test = $staff.status
            installed_login_windows_pass = @($launch | Where-Object { $_.status -eq "PASS" }).Count
            receipt_width_mm = $print.receipt.qt_page_width_mm
            receipt_height_mm = $print.receipt.qt_page_height_mm
            receipt_ink_width_ratio = $print.receipt.qt_ink_width_ratio
          } | ConvertTo-Json -Depth 8 | Set-Content final-proof-evidence/FINAL_INSTALLED_PROOF.json -Encoding UTF8
          Get-Content final-proof-evidence/FINAL_INSTALLED_PROOF.json

      - name: Upload final installed proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CNKH-POS-V5-Final-Run111-Installed-Proof
          path: final-proof-evidence/
          retention-days: 90
          if-no-files-found: error
