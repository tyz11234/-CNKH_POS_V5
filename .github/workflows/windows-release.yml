name: Windows Release Gate

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
    tags: ["v5.*"]

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-package:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      QT_LOGGING_RULES: "qt.qpa.fonts.warning=false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Validate required repository files
        shell: pwsh
        run: |
          $required = @(
            "admin_launcher.py",
            "staff_launcher.py",
            "build/admin.spec",
            "build/staff.spec",
            "installer/CNKH_POS_V5.iss",
            "tools/windows_gui_acceptance.py",
            "tools/packaged_self_test.py"
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) { throw "Missing required files: $($missing -join ', ')" }
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Ruff lint
        run: python -m ruff check .
      - name: Compile Qt resources
        run: pyside6-rcc resources/resources.qrc -o cnkh_pos/resources_rc.py
      - name: Automated tests
        run: python -m pytest -q --disable-warnings --maxfail=1
      - name: Unittest discovery
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q cnkh_pos tools tests admin_launcher.py staff_launcher.py
      - name: Source self-test
        run: python tools/source_self_test.py
      - name: Windows GUI acceptance 100 percent
        env:
          QT_SCALE_FACTOR: "1.0"
        run: python -m tools.windows_gui_acceptance --scale 100
      - name: Windows GUI acceptance 125 percent
        env:
          QT_SCALE_FACTOR: "1.25"
        run: python -m tools.windows_gui_acceptance --scale 125
      - name: Windows GUI acceptance 150 percent
        env:
          QT_SCALE_FACTOR: "1.5"
        run: python -m tools.windows_gui_acceptance --scale 150
      - name: Build Admin EXE
        run: pyinstaller --noconfirm --clean build/admin.spec
      - name: Build Staff EXE
        run: pyinstaller --noconfirm --clean build/staff.spec
      - name: Verify packaged EXEs
        shell: pwsh
        run: |
          $executables = @("dist/CNKH_POS_Admin.exe", "dist/CNKH_POS_Staff.exe")
          foreach ($file in $executables) {
            if (-not (Test-Path $file)) { throw "Missing packaged executable: $file" }
            if ((Get-Item $file).Length -lt 10MB) { throw "Packaged executable is unexpectedly small: $file" }
          }
      - name: Packaged Admin self-test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path self-test-artifacts -Force | Out-Null
          $report = (Join-Path (Resolve-Path self-test-artifacts) "packaged-admin.json")
          $env:CNKH_POS_SELF_TEST_REPORT = $report
          $process = Start-Process -FilePath (Resolve-Path "dist/CNKH_POS_Admin.exe") -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged Admin self-test failed with exit code $($process.ExitCode); report: $report" }
          if (-not (Test-Path $report)) { throw "Packaged Admin self-test report is missing: $report" }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          $result | ConvertTo-Json -Depth 8 | Write-Host
          if ($result.status -ne "PASS" -or $result.mode -ne "admin") { throw "Packaged Admin self-test JSON did not report PASS/admin" }
      - name: Packaged Staff self-test
        shell: pwsh
        run: |
          $report = (Join-Path (Resolve-Path self-test-artifacts) "packaged-staff.json")
          $env:CNKH_POS_SELF_TEST_REPORT = $report
          $process = Start-Process -FilePath (Resolve-Path "dist/CNKH_POS_Staff.exe") -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged Staff self-test failed with exit code $($process.ExitCode); report: $report" }
          if (-not (Test-Path $report)) { throw "Packaged Staff self-test report is missing: $report" }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          $result | ConvertTo-Json -Depth 8 | Write-Host
          if ($result.status -ne "PASS" -or $result.mode -ne "staff") { throw "Packaged Staff self-test JSON did not report PASS/staff" }
      - name: Build Setup.exe
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup --no-progress -y }
          iscc installer\CNKH_POS_V5.iss
      - name: Silent install and installed self-tests
        shell: pwsh
        run: |
          $setup = (Resolve-Path "release/CNKH_Hardware_POS_V5_Setup.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP "CNKH-POS-V5-Installed"
          $process = Start-Process -FilePath $setup -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/DIR=$installDir"
          ) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Silent installer failed: $($process.ExitCode)" }
          $admin = Join-Path $installDir "CNKH_POS_Admin.exe"
          $staff = Join-Path $installDir "CNKH_POS_Staff.exe"
          if (-not (Test-Path $admin) -or -not (Test-Path $staff)) {
            throw "Installed Admin or Staff executable is missing"
          }
          $artifactDir = (Resolve-Path "self-test-artifacts").Path
          $adminReport = Join-Path $artifactDir "installed-admin.json"
          $env:CNKH_POS_SELF_TEST_REPORT = $adminReport
          $adminProcess = Start-Process -FilePath $admin -ArgumentList "--self-test" -Wait -PassThru
          if ($adminProcess.ExitCode -ne 0) {
            throw "Installed Admin self-test failed with exit code $($adminProcess.ExitCode); report: $adminReport"
          }
          if (-not (Test-Path $adminReport)) { throw "Installed Admin self-test report is missing: $adminReport" }
          $adminResult = Get-Content $adminReport -Raw | ConvertFrom-Json
          $adminResult | ConvertTo-Json -Depth 8 | Write-Host
          if ($adminResult.status -ne "PASS" -or $adminResult.mode -ne "admin") { throw "Installed Admin self-test JSON did not report PASS/admin" }
          $staffReport = Join-Path $artifactDir "installed-staff.json"
          $env:CNKH_POS_SELF_TEST_REPORT = $staffReport
          $staffProcess = Start-Process -FilePath $staff -ArgumentList "--self-test" -Wait -PassThru
          if ($staffProcess.ExitCode -ne 0) {
            throw "Installed Staff self-test failed with exit code $($staffProcess.ExitCode); report: $staffReport"
          }
          if (-not (Test-Path $staffReport)) { throw "Installed Staff self-test report is missing: $staffReport" }
          $staffResult = Get-Content $staffReport -Raw | ConvertFrom-Json
          $staffResult | ConvertTo-Json -Depth 8 | Write-Host
          if ($staffResult.status -ne "PASS" -or $staffResult.mode -ne "staff") { throw "Installed Staff self-test JSON did not report PASS/staff" }
      - name: Installed EXE normal launch smoke test
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "CNKH-POS-V5-Installed"
          $admin = Join-Path $installDir "CNKH_POS_Admin.exe"
          $staff = Join-Path $installDir "CNKH_POS_Staff.exe"
          if (-not (Test-Path $admin) -or -not (Test-Path $staff)) {
            throw "Installed Admin or Staff executable is missing before normal-launch smoke test"
          }
          New-Item -ItemType Directory -Path self-test-artifacts -Force | Out-Null
          $artifactDir = (Resolve-Path "self-test-artifacts").Path

          $smokeLocalAppData = Join-Path $env:RUNNER_TEMP "CNKH-POS-V5-Smoke-Profile"
          if (Test-Path $smokeLocalAppData) { Remove-Item $smokeLocalAppData -Recurse -Force }
          New-Item -ItemType Directory -Path $smokeLocalAppData -Force | Out-Null
          $env:LOCALAPPDATA = $smokeLocalAppData

          @'
          from cnkh_pos.config import AppPaths
          from cnkh_pos.database.bootstrap import bootstrap_database
          from cnkh_pos.database.connection import Database
          from cnkh_pos.services.auth import AuthService

          paths = AppPaths.default()
          paths.ensure_directories()
          bootstrap_database(paths.database, paths.backups)
          database = Database(paths.database)
          with database.transaction() as conn:
              admin_id = AuthService.create_user(
                  conn,
                  username="ciadmin",
                  display_name="CI Admin",
                  password="CIAdmin123!",
                  role="ADMIN",
                  permissions={},
                  admin_id=None,
              )
              AuthService.create_user(
                  conn,
                  username="cistaff",
                  display_name="CI Staff",
                  password="CIStaff123!",
                  role="STAFF",
                  permissions={},
                  admin_id=admin_id,
              )
          '@ | python -

          function Test-CnkhWindow {
            param(
              [Parameter(Mandatory=$true)][string]$ExePath,
              [Parameter(Mandatory=$true)][string]$ProcessName,
              [Parameter(Mandatory=$true)][string]$ExpectedTitle
            )

            $startedAt = Get-Date
            $launcher = $null
            $observed = $null
            try {
              $launcher = Start-Process -FilePath $ExePath -PassThru
              for ($attempt = 0; $attempt -lt 360; $attempt++) {
                Start-Sleep -Milliseconds 250
                $candidates = @(Get-Process -Name $ProcessName -ErrorAction SilentlyContinue | Where-Object { $_.StartTime -ge $startedAt.AddSeconds(-2) })
                foreach ($candidate in $candidates) {
                  $candidate.Refresh()
                  if ($candidate.MainWindowHandle -ne 0 -and $candidate.MainWindowTitle -eq $ExpectedTitle) {
                    $observed = $candidate
                    break
                  }
                }
                if ($null -ne $observed) { break }
                if ($launcher.HasExited) {
                  return [pscustomobject]@{
                    exe = $ExePath
                    process = $ProcessName
                    expected_title = $ExpectedTitle
                    observed_title = ""
                    main_window_handle = 0
                    exit_code = $launcher.ExitCode
                    status = "FAIL"
                    error = "process exited before expected login window appeared"
                  }
                }
              }
              if ($null -eq $observed) {
                $titles = @(Get-Process -Name $ProcessName -ErrorAction SilentlyContinue | ForEach-Object { $_.Refresh(); $_.MainWindowTitle } | Where-Object { $_ })
                return [pscustomobject]@{
                  exe = $ExePath
                  process = $ProcessName
                  expected_title = $ExpectedTitle
                  observed_title = ($titles -join "; ")
                  main_window_handle = 0
                  exit_code = $null
                  status = "FAIL"
                  error = "expected login window title was not observed within 90 seconds"
                }
              }
              return [pscustomobject]@{
                exe = $ExePath
                process = $ProcessName
                expected_title = $ExpectedTitle
                observed_title = $observed.MainWindowTitle
                main_window_handle = $observed.MainWindowHandle
                exit_code = $null
                status = "PASS"
                error = ""
              }
            } catch {
              return [pscustomobject]@{
                exe = $ExePath
                process = $ProcessName
                expected_title = $ExpectedTitle
                observed_title = ""
                main_window_handle = 0
                exit_code = $null
                status = "FAIL"
                error = $_.Exception.Message
              }
            } finally {
              Get-Process -Name $ProcessName -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            }
          }

          $launchResults = @(
            Test-CnkhWindow -ExePath $admin -ProcessName "CNKH_POS_Admin" -ExpectedTitle "CNKH POS Admin Login"
            Test-CnkhWindow -ExePath $staff -ProcessName "CNKH_POS_Staff" -ExpectedTitle "CNKH POS Staff Login"
          )
          $launchReport = Join-Path $artifactDir "installed-normal-launch.json"
          $launchResults | ConvertTo-Json -Depth 8 | Set-Content $launchReport -Encoding UTF8
          $launchResults | ConvertTo-Json -Depth 8 | Write-Host
          $launchFailures = @($launchResults | Where-Object { $_.status -ne "PASS" })
          if ($launchFailures.Count -ne 0) {
            throw "One or more installed EXEs did not open their expected Windows login window; report: $launchReport"
          }
      - name: Release manifest
        shell: pwsh
        run: |
          $files = Get-ChildItem dist\*.exe, release\*.exe
          $manifest = $files | ForEach-Object { [pscustomobject]@{ file=$_.Name; sha256=(Get-FileHash $_.FullName -Algorithm SHA256).Hash; bytes=$_.Length } }
          $manifest | ConvertTo-Json | Set-Content release\release-manifest.json -Encoding UTF8
          $files | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content release\SHA256SUMS.txt -Encoding ascii
      - name: Verify release package
        shell: pwsh
        run: |
          $required = @(
            "dist/CNKH_POS_Admin.exe",
            "dist/CNKH_POS_Staff.exe",
            "release/CNKH_Hardware_POS_V5_Setup.exe",
            "release/release-manifest.json",
            "release/SHA256SUMS.txt"
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) { throw "Release package is incomplete: $($missing -join ', ')" }
          $installerSources = Select-String -Path installer/CNKH_POS_V5.iss -Pattern '^Source:'
          if ($installerSources.Count -ne 2) { throw "Installer must contain exactly two executable sources" }
          $installerText = Get-Content installer/CNKH_POS_V5.iss -Raw
          if ($installerText -notmatch 'CNKH_POS_Admin.exe' -or $installerText -notmatch 'CNKH_POS_Staff.exe') {
            throw "Installer source list does not contain both Admin and Staff EXEs"
          }
      - name: Prepare download package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-package -Force | Out-Null
          Copy-Item dist/CNKH_POS_Admin.exe release-package/
          Copy-Item dist/CNKH_POS_Staff.exe release-package/
          Copy-Item release/CNKH_Hardware_POS_V5_Setup.exe release-package/
          Copy-Item release/release-manifest.json release-package/
          Copy-Item release/SHA256SUMS.txt release-package/
          Copy-Item ui-acceptance-artifacts release-package/ui-acceptance-artifacts -Recurse
          [pscustomobject]@{
            version = (Get-Content VERSION -Raw).Trim()
            commit = "${{ github.sha }}"
            workflow_run = "${{ github.run_number }}"
          } | ConvertTo-Json | Set-Content release-package/build-info.json -Encoding UTF8
      - name: Upload GUI acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CNKH-POS-V5-GUI-Acceptance
          path: ui-acceptance-artifacts/
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload self-test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CNKH-POS-V5-Self-Test-Diagnostics
          path: self-test-artifacts/
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload tested Windows package
        uses: actions/upload-artifact@v4
        with:
          name: CNKH-Hardware-POS-V5-Windows
          path: release-package/
          if-no-files-found: error
          retention-days: 90
