name: Fix 80mm Dynamic Receipt Length

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/fix-80mm-dynamic-length.yml"

permissions:
  contents: write

jobs:
  fix-test:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      QT_LOGGING_RULES: qt.qpa.fonts.warning=false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply dynamic receipt length fix and regression
        shell: python
        run: |
          from pathlib import Path

          printing = Path("cnkh_pos/services/printing.py")
          text = printing.read_text(encoding="utf-8")
          old = "            paper_height_mm = max(297.0, source_height_mm)\n"
          new = (
              "            # Thermal receipt rolls should advance only for rendered content;\n"
              "            # do not force an A4-length 297 mm page that wastes blank paper.\n"
              "            paper_height_mm = source_height_mm\n"
          )
          if text.count(old) != 1:
              raise SystemExit("expected 297mm receipt-height anchor not found exactly once")
          printing.write_text(text.replace(old, new, 1), encoding="utf-8")

          test_path = Path("tests/test_final_print_evidence.py")
          test = test_path.read_text(encoding="utf-8")
          old_block = '''        qt_document = QPdfDocument()\n        qt_document.load(str(qt_pdf))\n        assert qt_document.pageCount() == 1\n        preview = qt_document.render(0, QSize(400, 1485))\n        assert not preview.isNull()\n        preview_path = EVIDENCE_DIR / "final-receipt-qt-80mm-preview.png"\n        assert preview.save(str(preview_path), "PNG")\n        qt_document.close()\n'''
          new_block = '''        qt_document = QPdfDocument()\n        qt_document.load(str(qt_pdf))\n        assert qt_document.pageCount() == 1\n        qt_page_points = qt_document.pagePointSize(0)\n        qt_page_width_mm = float(qt_page_points.width()) * 25.4 / 72.0\n        qt_page_height_mm = float(qt_page_points.height()) * 25.4 / 72.0\n        assert 79.0 <= qt_page_width_mm <= 81.0\n        # The source receipt is content-sized (120 mm for this evidence sale).\n        # A regression to the old 297 mm A4-like roll length must fail.\n        assert 110.0 <= qt_page_height_mm <= 130.0\n        preview_width = 400\n        preview_height = max(\n            1,\n            int(round(preview_width * qt_page_points.height() / qt_page_points.width())),\n        )\n        preview = qt_document.render(0, QSize(preview_width, preview_height))\n        assert not preview.isNull()\n        preview_path = EVIDENCE_DIR / "final-receipt-qt-80mm-preview.png"\n        assert preview.save(str(preview_path), "PNG")\n        qt_document.close()\n'''
          if test.count(old_block) != 1:
              raise SystemExit("Qt receipt preview regression anchor not found exactly once")
          test = test.replace(old_block, new_block, 1)
          payload_anchor = '                "qt_ink_width_ratio": round(qt_ink_width_ratio, 4),\n'
          payload_new = (
              payload_anchor
              + '                "qt_page_width_mm": round(qt_page_width_mm, 2),\n'
              + '                "qt_page_height_mm": round(qt_page_height_mm, 2),\n'
          )
          if test.count(payload_anchor) != 1:
              raise SystemExit("Qt receipt evidence JSON anchor not found exactly once")
          test_path.write_text(test.replace(payload_anchor, payload_new, 1), encoding="utf-8")
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Compile Qt resources
        run: pyside6-rcc resources/resources.qrc -o cnkh_pos/resources_rc.py
      - name: Ruff receipt changes
        run: python -m ruff check cnkh_pos/services/printing.py tests/test_final_print_evidence.py
      - name: Focused 80mm receipt tests
        run: python -m pytest -q tests/test_printing_layout.py tests/test_final_print_evidence.py
      - name: Commit verified receipt-length fix and self-clean workflow
        shell: bash
        run: |
          rm .github/workflows/fix-80mm-dynamic-length.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cnkh_pos/services/printing.py tests/test_final_print_evidence.py .github/workflows/fix-80mm-dynamic-length.yml
          git diff --cached --check
          git commit -m "Fix 80mm receipt paper length"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Upload focused receipt evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CNKH-POS-V5-80mm-Dynamic-Length
          path: self-test-artifacts/
          if-no-files-found: ignore
          retention-days: 30
