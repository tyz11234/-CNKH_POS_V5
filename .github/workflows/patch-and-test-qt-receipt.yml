name: Patch and Test Qt Receipt

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/patch-and-test-qt-receipt.yml"

permissions:
  contents: write

jobs:
  patch-test:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: "offscreen"
      QT_LOGGING_RULES: "qt.qpa.fonts.warning=false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Patch Qt receipt path and visual regression
        shell: python
        run: |
          from pathlib import Path

          printing_path = Path("cnkh_pos/services/printing.py")
          text = printing_path.read_text(encoding="utf-8")
          marker = "    def print_receipt(\n"
          if marker not in text:
              raise SystemExit("print_receipt marker not found")
          prefix = text.split(marker, 1)[0]
          method = '''    def print_receipt(\n        self, receipt: Receipt, *, output_pdf: Path | None = None\n    ) -> None:\n        \"\"\"Print the verified 80mm PDF layout through Qt at thermal-printer DPI.\"\"\"\n        import tempfile\n\n        from PySide6.QtCore import (\n            QByteArray,\n            QBuffer,\n            QIODevice,\n            QMarginsF,\n            QRectF,\n            QSize,\n            QSizeF,\n            Qt,\n        )\n        from PySide6.QtGui import QPageLayout, QPageSize, QPainter\n        from PySide6.QtPdf import QPdfDocument\n        from PySide6.QtPrintSupport import QPrinter, QPrinterInfo\n\n        target_pdf = Path(output_pdf) if output_pdf is not None else None\n        with tempfile.TemporaryDirectory() as folder:\n            source_pdf = Path(folder) / \"receipt-layout.pdf\"\n            self.render_pdf(receipt, source_pdf)\n\n            # Load from memory rather than asking QPdfDocument to keep the Windows\n            # file open. This prevents the PDF engine from blocking temp cleanup.\n            source_data = QByteArray(source_pdf.read_bytes())\n            source_pdf.unlink()\n            buffer = QBuffer()\n            buffer.setData(source_data)\n            if not buffer.open(QIODevice.OpenModeFlag.ReadOnly):\n                raise RuntimeError(\"receipt PDF buffer could not be opened\")\n            document = QPdfDocument()\n            document.load(buffer)\n            if document.pageCount() != 1:\n                document.close()\n                buffer.close()\n                raise RuntimeError(\"receipt PDF could not be loaded for printing\")\n            page_points = document.pagePointSize(0)\n            if page_points.width() <= 0 or page_points.height() <= 0:\n                document.close()\n                buffer.close()\n                raise RuntimeError(\"receipt PDF reported an invalid page size\")\n\n            printer = QPrinter(QPrinter.PrinterMode.HighResolution)\n            if target_pdf is not None:\n                target_pdf.parent.mkdir(parents=True, exist_ok=True)\n                printer.setOutputFormat(QPrinter.OutputFormat.PdfFormat)\n                printer.setOutputFileName(str(target_pdf))\n            else:\n                available = set(QPrinterInfo.availablePrinterNames())\n                target = resolve_printer_target(\n                    receipt.settings,\n                    available_printers=available,\n                    default_printer_available=not QPrinterInfo.defaultPrinter().isNull(),\n                )\n                if target is not None:\n                    printer.setPrinterName(target)\n\n            # 203 dpi is the dominant resolution for retail 80mm thermal printers.\n            # Rasterizing the already-verified PDF avoids the QTextDocument/Windows\n            # font-path corruption that can turn receipt glyphs into black blocks.\n            printer.setResolution(203)\n            source_height_mm = float(page_points.height()) * 25.4 / 72.0\n            paper_height_mm = max(297.0, source_height_mm)\n            printer.setPageSize(\n                QPageSize(\n                    QSizeF(80.0, paper_height_mm),\n                    QPageSize.Unit.Millimeter,\n                    \"80mm Receipt\",\n                )\n            )\n            printer.setPageMargins(\n                QMarginsF(0, 0, 0, 0), QPageLayout.Unit.Millimeter\n            )\n            printer.setFullPage(True)\n\n            dpi = max(203, int(printer.resolution()))\n            render_size = QSize(\n                max(1, int(round(float(page_points.width()) * dpi / 72.0))),\n                max(1, int(round(float(page_points.height()) * dpi / 72.0))),\n            )\n            image = document.render(0, render_size)\n            if image.isNull():\n                document.close()\n                buffer.close()\n                raise RuntimeError(\"receipt PDF could not be rasterized for printing\")\n\n            painter = QPainter(printer)\n            if not painter.isActive():\n                document.close()\n                buffer.close()\n                raise RuntimeError(\"printer could not start an 80mm receipt print job\")\n            try:\n                page_rect = printer.pageLayout().fullRectPixels(dpi)\n                painter.fillRect(QRectF(page_rect), Qt.GlobalColor.white)\n                scale = min(\n                    float(page_rect.width()) / float(image.width()),\n                    float(page_rect.height()) / float(image.height()),\n                )\n                draw_width = float(image.width()) * scale\n                draw_height = float(image.height()) * scale\n                target_rect = QRectF(\n                    float(page_rect.x()) + (float(page_rect.width()) - draw_width) / 2.0,\n                    float(page_rect.y()),\n                    draw_width,\n                    draw_height,\n                )\n                painter.drawImage(target_rect, image)\n            finally:\n                painter.end()\n                document.close()\n                buffer.close()\n\n            if printer.printerState() == QPrinter.PrinterState.Error:\n                raise RuntimeError(\"printer reported an error while sending the receipt\")\n            if target_pdf is not None and (\n                not target_pdf.is_file() or target_pdf.stat().st_size == 0\n            ):\n                raise RuntimeError(\"PDF receipt output was not created\")\n'''
          printing_path.write_text(prefix + method, encoding="utf-8")

          test_path = Path("tests/test_final_print_evidence.py")
          test = test_path.read_text(encoding="utf-8")
          old_import = "from PySide6.QtWidgets import QApplication\n"
          new_import = (
              "from PySide6.QtCore import QSize\n"
              "from PySide6.QtPdf import QPdfDocument\n"
              "from PySide6.QtWidgets import QApplication\n"
          )
          if "from PySide6.QtPdf import QPdfDocument" not in test:
              if old_import not in test:
                  raise SystemExit("Qt import anchor not found")
              test = test.replace(old_import, new_import, 1)

          old_assert = '''        printing.print_receipt(receipt, output_pdf=qt_pdf)\n        app.processEvents()\n        assert reportlab_pdf.stat().st_size > 500\n        assert qt_pdf.is_file() and qt_pdf.stat().st_size > 500\n'''
          new_assert = '''        printing.print_receipt(receipt, output_pdf=qt_pdf)\n        app.processEvents()\n        assert reportlab_pdf.stat().st_size > 500\n        assert qt_pdf.is_file() and qt_pdf.stat().st_size > 500\n\n        # Render the PDF that has passed through the actual Qt/QPrinter path.\n        # The old QTextDocument regression collapsed normal glyphs into a narrow\n        # column of black rectangles; require receipt content to span the page.\n        qt_document = QPdfDocument()\n        qt_document.load(str(qt_pdf))\n        assert qt_document.pageCount() == 1\n        preview = qt_document.render(0, QSize(400, 1485))\n        assert not preview.isNull()\n        preview_path = EVIDENCE_DIR / \"final-receipt-qt-80mm-preview.png\"\n        assert preview.save(str(preview_path), \"PNG\")\n        qt_document.close()\n\n        from PIL import Image, ImageOps\n\n        with Image.open(preview_path) as preview_image:\n            grayscale = preview_image.convert(\"L\")\n            ink = ImageOps.invert(grayscale).point(\n                lambda value: 255 if value >= 32 else 0\n            )\n            bbox = ink.getbbox()\n            preview_width = grayscale.width\n        assert bbox is not None\n        qt_ink_width_ratio = (bbox[2] - bbox[0]) / preview_width\n        assert qt_ink_width_ratio >= 0.65\n'''
          if old_assert not in test:
              raise SystemExit("final print assertion anchor not found")
          test = test.replace(old_assert, new_assert, 1)
          payload_anchor = '                "qt_bytes": qt_pdf.stat().st_size,\n'
          if '"qt_ink_width_ratio"' not in test:
              if payload_anchor not in test:
                  raise SystemExit("print evidence payload anchor not found")
              test = test.replace(
                  payload_anchor,
                  payload_anchor + '                "qt_ink_width_ratio": round(qt_ink_width_ratio, 4),\n',
                  1,
              )
          test_path.write_text(test, encoding="utf-8")
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Compile Qt resources
        run: pyside6-rcc resources/resources.qrc -o cnkh_pos/resources_rc.py
      - name: Ruff only receipt changes
        run: python -m ruff check cnkh_pos/services/printing.py tests/test_printing_layout.py tests/test_final_print_evidence.py
      - name: Focused receipt tests
        run: python -m pytest -q tests/test_printing_layout.py tests/test_final_print_evidence.py
      - name: Commit verified receipt fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cnkh_pos/services/printing.py tests/test_final_print_evidence.py
          git diff --cached --check
          git commit -m "Fix Qt thermal receipt rendering"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Upload focused print evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CNKH-POS-V5-Qt-Receipt-Focused
          path: self-test-artifacts/
          if-no-files-found: ignore
          retention-days: 30
