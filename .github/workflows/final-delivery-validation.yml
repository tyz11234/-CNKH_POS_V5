name: CNKH POS V5 Final Delivery Validation

on:
  pull_request:
    branches:
      - ci/final-delivery-base-20260811

permissions:
  contents: read
  actions: read

jobs:
  final-delivery:
    runs-on: windows-latest
    timeout-minutes: 70
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      FINAL_MAIN_SHA: b47c95833a20335ab13139482662748d1fa07898
      RUN106_ID: "31412075807"
      RUN106_ARTIFACT_ID: "9072475631"
      RUN106_ARTIFACT_DIGEST: sha256:1ffec9a1cfed426e2c0e7be30ec04c7823d6d0f58890786ab8b109a8b4f7d393
    steps:
      - name: Checkout exact final main commit
        uses: actions/checkout@v4
        with:
          ref: b47c95833a20335ab13139482662748d1fa07898
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Create clean final source ZIP from exact main commit
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path delivery/source -Force | Out-Null
          $zip = "delivery/source/CNKH_POS_V5_5.0.0-alpha.4_Final_Source.zip"
          git archive --format=zip --output=$zip HEAD
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $zip)) { throw "git archive failed" }
          @'
          from pathlib import PurePosixPath
          from zipfile import ZipFile

          archive = "delivery/source/CNKH_POS_V5_5.0.0-alpha.4_Final_Source.zip"
          forbidden_dirs = {"__pycache__", ".pytest_cache", ".ruff_cache", ".venv", "dist", "release", "release-package", "ui-acceptance-artifacts", "self-test-artifacts"}
          forbidden_suffixes = {".db", ".sqlite", ".sqlite3", ".exe", ".msi", ".pyc", ".pyo", ".log"}
          bad = []
          with ZipFile(archive) as zf:
              names = zf.namelist()
              for name in names:
                  p = PurePosixPath(name)
                  if any(part in forbidden_dirs for part in p.parts):
                      bad.append(name)
                      continue
                  if p.suffix.lower() in forbidden_suffixes:
                      bad.append(name)
              required = {
                  "VERSION",
                  ".github/workflows/windows-release.yml",
                  "admin_launcher.py",
                  "staff_launcher.py",
                  "build/admin.spec",
                  "build/staff.spec",
                  "installer/CNKH_POS_V5.iss",
                  "tests/test_full_business_lifecycle.py",
                  "cnkh_pos/services/barcode_labels.py",
                  "cnkh_pos/services/checkout_rounding.py",
                  "cnkh_pos/services/discounts.py",
              }
              missing = sorted(required - set(names))
          if bad:
              raise SystemExit("forbidden source entries: " + ", ".join(bad))
          if missing:
              raise SystemExit("missing source entries: " + ", ".join(missing))
          print(f"SOURCE_ZIP_ENTRIES={len(names)} FORBIDDEN=0")
          '@ | python -
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $zip -Leaf)" | Set-Content delivery/source/CNKH_POS_V5_5.0.0-alpha.4_Final_Source.zip.sha256.txt -Encoding ascii

      - name: Download exact Run 106 tested Windows package
        uses: actions/download-artifact@v4
        with:
          name: CNKH-Hardware-POS-V5-Windows
          path: run106-package
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 31412075807

      - name: Download Run 106 diagnostics
        uses: actions/download-artifact@v4
        with:
          name: CNKH-POS-V5-Self-Test-Diagnostics
          path: run106-diagnostics
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 31412075807

      - name: Download Run 106 GUI evidence
        uses: actions/download-artifact@v4
        with:
          name: CNKH-POS-V5-GUI-Acceptance
          path: run106-gui
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 31412075807

      - name: Verify Run 106 package and prepare Setup deliverable
        shell: pwsh
        run: |
          $package = (Resolve-Path run106-package).Path
          $setup = Join-Path $package "CNKH_Hardware_POS_V5_Setup.exe"
          $buildInfoPath = Join-Path $package "build-info.json"
          $sumsPath = Join-Path $package "SHA256SUMS.txt"
          $manifestPath = Join-Path $package "release-manifest.json"
          foreach ($required in @($setup, $buildInfoPath, $sumsPath, $manifestPath)) {
            if (-not (Test-Path $required)) { throw "Run 106 package missing: $required" }
          }
          $buildInfo = Get-Content $buildInfoPath -Raw | ConvertFrom-Json
          if ([string]$buildInfo.workflow_run -ne "106") { throw "Unexpected build-info workflow_run: $($buildInfo.workflow_run)" }
          if ($buildInfo.version -ne "5.0.0-alpha.4") { throw "Unexpected version: $($buildInfo.version)" }
          foreach ($line in Get-Content $sumsPath) {
            if (-not $line.Trim()) { continue }
            $parts = $line -split '\s+', 2
            if ($parts.Count -ne 2) { throw "Invalid SHA256SUMS line: $line" }
            $expected = $parts[0].Trim().ToLowerInvariant()
            $candidate = Join-Path $package $parts[1].Trim()
            if (-not (Test-Path $candidate)) { throw "SHA file missing: $($parts[1])" }
            $actual = (Get-FileHash $candidate -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "SHA mismatch: $candidate" }
          }
          New-Item -ItemType Directory -Path delivery/setup -Force | Out-Null
          Copy-Item $setup delivery/setup/CNKH_Hardware_POS_V5_Setup.exe
          Copy-Item $manifestPath delivery/setup/release-manifest.json
          Copy-Item $sumsPath delivery/setup/RUN106_SHA256SUMS.txt
          Copy-Item $buildInfoPath delivery/setup/build-info.json
          $setupHash = (Get-FileHash delivery/setup/CNKH_Hardware_POS_V5_Setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$setupHash  CNKH_Hardware_POS_V5_Setup.exe" | Set-Content delivery/setup/CNKH_Hardware_POS_V5_Setup.exe.sha256.txt -Encoding ascii
          New-Item -ItemType Directory -Path delivery/evidence -Force | Out-Null
          [pscustomobject]@{
            status = "PASS"
            final_main_sha = $env:FINAL_MAIN_SHA
            run106_id = [int64]$env:RUN106_ID
            run106_artifact_id = [int64]$env:RUN106_ARTIFACT_ID
            run106_artifact_digest = $env:RUN106_ARTIFACT_DIGEST
            build_info_commit = $buildInfo.commit
            build_info_workflow_run = $buildInfo.workflow_run
            version = $buildInfo.version
            setup_sha256 = $setupHash
            internal_sha256s_verified = $true
          } | ConvertTo-Json -Depth 8 | Set-Content delivery/evidence/run106-package-identity.json -Encoding UTF8

      - name: Silent install exact Run 106 Setup
        shell: pwsh
        run: |
          $setup = (Resolve-Path delivery/setup/CNKH_Hardware_POS_V5_Setup.exe).Path
          $installDir = Join-Path $env:RUNNER_TEMP "CNKH-POS-V5-Final-Installed"
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }
          $process = Start-Process -FilePath $setup -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=$installDir"
          ) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Final Setup silent install failed: $($process.ExitCode)" }
          $admin = Join-Path $installDir "CNKH_POS_Admin.exe"
          $staff = Join-Path $installDir "CNKH_POS_Staff.exe"
          if (-not (Test-Path $admin) -or -not (Test-Path $staff)) { throw "Installed EXEs missing" }
          [pscustomobject]@{
            status = "PASS"
            install_dir = $installDir
            admin_sha256 = (Get-FileHash $admin -Algorithm SHA256).Hash.ToLowerInvariant()
            staff_sha256 = (Get-FileHash $staff -Algorithm SHA256).Hash.ToLowerInvariant()
          } | ConvertTo-Json -Depth 5 | Set-Content delivery/evidence/installed-files.json -Encoding UTF8

      - name: Installed Admin and Staff self-tests from Run 106 Setup
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "CNKH-POS-V5-Final-Installed"
          $profile = Join-Path $env:RUNNER_TEMP "CNKH-POS-V5-Final-SelfTest-Profile"
          if (Test-Path $profile) { Remove-Item $profile -Recurse -Force }
          New-Item -ItemType Directory -Path $profile -Force | Out-Null
          $env:LOCALAPPDATA = $profile
          $admin = Join-Path $installDir "CNKH_POS_Admin.exe"
          $staff = Join-Path $installDir "CNKH_POS_Staff.exe"
          $adminReport = (Resolve-Path delivery/evidence).Path + "\\installed-admin.json"
          $env:CNKH_POS_SELF_TEST_REPORT = $adminReport
          $p = Start-Process $admin -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path $adminReport)) { throw "Installed Admin self-test failed" }
          $r = Get-Content $adminReport -Raw | ConvertFrom-Json
          if ($r.status -ne "PASS" -or $r.mode -ne "admin") { throw "Installed Admin JSON non-PASS" }
          $staffReport = (Resolve-Path delivery/evidence).Path + "\\installed-staff.json"
          $env:CNKH_POS_SELF_TEST_REPORT = $staffReport
          $p = Start-Process $staff -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path $staffReport)) { throw "Installed Staff self-test failed" }
          $r = Get-Content $staffReport -Raw | ConvertFrom-Json
          if ($r.status -ne "PASS" -or $r.mode -ne "staff") { throw "Installed Staff JSON non-PASS" }

      - name: Run complete business lifecycle after Run 106 installation
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if (Test-Path self-test-artifacts) { Remove-Item self-test-artifacts -Recurse -Force }
          python -m pytest -q tests/test_full_business_lifecycle.py
          $report = "self-test-artifacts/full-business-acceptance.json"
          if (-not (Test-Path $report)) { throw "Business lifecycle report missing" }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          $passes = @($result.checks | Where-Object { $_.status -eq "PASS" })
          if ($result.status -ne "PASS" -or $passes.Count -ne 25) {
            throw "Full business lifecycle did not produce exactly 25 PASS checks"
          }
          Copy-Item $report delivery/evidence/full-business-acceptance.json -Force

      - name: Re-open both installed EXEs as real Windows windows
        shell: pwsh
        run: |
          $profile = Join-Path $env:RUNNER_TEMP "CNKH-POS-V5-Final-NormalLaunch-Profile"
          if (Test-Path $profile) { Remove-Item $profile -Recurse -Force }
          New-Item -ItemType Directory -Path $profile -Force | Out-Null
          $env:LOCALAPPDATA = $profile
          Remove-Item Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue
          @'
          from cnkh_pos.config import AppPaths
          from cnkh_pos.database.bootstrap import bootstrap_database
          from cnkh_pos.database.connection import Database
          from cnkh_pos.services.auth import AuthService
          paths = AppPaths.default(); paths.ensure_directories(); bootstrap_database(paths.database, paths.backups)
          database = Database(paths.database)
          with database.transaction() as conn:
              admin_id = AuthService.create_user(conn, username="final-admin", display_name="Final Admin", password="FinalAdmin123!", role="ADMIN", permissions={}, admin_id=None)
              AuthService.create_user(conn, username="final-staff", display_name="Final Staff", password="FinalStaff123!", role="STAFF", permissions={"apply_discount": True}, admin_id=admin_id)
          '@ | python -
          $installDir = Join-Path $env:RUNNER_TEMP "CNKH-POS-V5-Final-Installed"
          function Observe-Window([string]$exe,[string]$processName,[string]$title) {
            $startedAt = Get-Date
            $launcher = Start-Process $exe -PassThru
            $observed = $null
            try {
              for ($i=0; $i -lt 360; $i++) {
                Start-Sleep -Milliseconds 250
                foreach ($candidate in @(Get-Process -Name $processName -ErrorAction SilentlyContinue | Where-Object { $_.StartTime -ge $startedAt.AddSeconds(-2) })) {
                  $candidate.Refresh()
                  if ($candidate.MainWindowHandle -ne 0 -and $candidate.MainWindowTitle -eq $title) { $observed = $candidate; break }
                }
                if ($null -ne $observed) { break }
                if ($launcher.HasExited) { break }
              }
              if ($null -eq $observed) { return [pscustomobject]@{status="FAIL"; expected_title=$title; observed_title=""; main_window_handle=0} }
              return [pscustomobject]@{status="PASS"; expected_title=$title; observed_title=$observed.MainWindowTitle; main_window_handle=$observed.MainWindowHandle}
            } finally {
              Get-Process -Name $processName -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            }
          }
          $results = @(
            Observe-Window (Join-Path $installDir "CNKH_POS_Admin.exe") "CNKH_POS_Admin" "CNKH POS Admin Login"
            Observe-Window (Join-Path $installDir "CNKH_POS_Staff.exe") "CNKH_POS_Staff" "CNKH POS Staff Login"
          )
          $results | ConvertTo-Json -Depth 8 | Set-Content delivery/evidence/installed-normal-launch.json -Encoding UTF8
          if (@($results | Where-Object {$_.status -ne "PASS"}).Count -ne 0) { throw "Final installed EXE normal launch failed" }

      - name: Copy Run 106 GUI and diagnostics evidence
        shell: pwsh
        run: |
          Copy-Item run106-diagnostics delivery/evidence/run106-diagnostics -Recurse
          Copy-Item run106-gui delivery/evidence/run106-gui -Recurse

      - name: Write final validation summary
        shell: pwsh
        run: |
          $identity = Get-Content delivery/evidence/run106-package-identity.json -Raw | ConvertFrom-Json
          $business = Get-Content delivery/evidence/full-business-acceptance.json -Raw | ConvertFrom-Json
          $launch = @(Get-Content delivery/evidence/installed-normal-launch.json -Raw | ConvertFrom-Json)
          $admin = Get-Content delivery/evidence/installed-admin.json -Raw | ConvertFrom-Json
          $staff = Get-Content delivery/evidence/installed-staff.json -Raw | ConvertFrom-Json
          $summary = @"
          CNKH Hardware POS V5 Final Delivery Validation
          Version: 5.0.0-alpha.4
          Final main commit: $env:FINAL_MAIN_SHA
          Windows Release Gate: Run #106 PASS
          Run #106 Windows Artifact ID: $env:RUN106_ARTIFACT_ID
          Run #106 Artifact digest: $env:RUN106_ARTIFACT_DIGEST
          Exact Setup SHA-256: $($identity.setup_sha256)
          Installed Admin self-test: $($admin.status)
          Installed Staff self-test: $($staff.status)
          Installed real login windows: $(@($launch | Where-Object {$_.status -eq 'PASS'}).Count)/2 PASS
          Full Windows business lifecycle: $(@($business.checks | Where-Object {$_.status -eq 'PASS'}).Count)/25 PASS
          GUI acceptance: 100% / 125% / 150% PASS in Run #106
          Qt 80mm PDF readable-render regression: PASS in Run #106
          Barcode labels: 50x30 default, 4-copy PDF evidence PASS
          Limitation: no physical USB/Bluetooth 80mm receipt printer or physical label printer is attached to the cloud runner; Windows printer/PDF/Qt rendering paths are validated, but device-specific driver/feed/cutter behavior must be confirmed on the shop's actual hardware.
          STATUS: WINDOWS INSTALLATION CANDIDATE PASS
          "@
          $summary.Trim() | Set-Content delivery/evidence/FINAL_VALIDATION_SUMMARY_CN.txt -Encoding UTF8
          $evidenceHashInput = Get-ChildItem delivery/evidence -File -Recurse | Sort-Object FullName | ForEach-Object { "$(Get-FileHash $_.FullName -Algorithm SHA256 | Select-Object -ExpandProperty Hash)  $($_.FullName.Substring((Resolve-Path delivery/evidence).Path.Length + 1))" }
          $evidenceHashInput | Set-Content delivery/evidence/EVIDENCE_SHA256SUMS.txt -Encoding ascii

      - name: Upload clean final source
        uses: actions/upload-artifact@v4
        with:
          name: CNKH-POS-V5-Final-Source
          path: delivery/source/
          if-no-files-found: error
          retention-days: 90

      - name: Upload final Setup only
        uses: actions/upload-artifact@v4
        with:
          name: CNKH-POS-V5-Final-Setup
          path: delivery/setup/
          if-no-files-found: error
          retention-days: 90

      - name: Upload final validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: CNKH-POS-V5-Final-Evidence
          path: delivery/evidence/
          if-no-files-found: error
          retention-days: 90
