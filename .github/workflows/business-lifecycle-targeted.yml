name: Business Lifecycle Targeted Check

on:
  pull_request:
    branches:
      - ci/run8-githubready-20260810
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: business-lifecycle-targeted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  business-lifecycle:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      QT_LOGGING_RULES: qt.qpa.fonts.warning=false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Compile Qt resources
        run: pyside6-rcc resources/resources.qrc -o cnkh_pos/resources_rc.py
      - name: Ruff official business lifecycle test
        run: python -m ruff check tests/test_full_business_lifecycle.py
      - name: Compile official business lifecycle test
        run: python -m compileall -q tests/test_full_business_lifecycle.py
      - name: Run official full Windows business lifecycle
        run: python -m pytest -q tests/test_full_business_lifecycle.py
      - name: Upload business lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Business-Lifecycle-Targeted-Evidence
          path: self-test-artifacts/full-business-acceptance.json
          if-no-files-found: error
          retention-days: 14
